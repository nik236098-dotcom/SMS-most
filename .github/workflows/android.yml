name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_adapter:
        description: 'Build experimental eSIM companion (requires review of upstream bridge)'
        type: boolean
        default: false
      bridge_ref:
        description: 'Reviewed commit SHA from Laiteux/openeuicc-bridge; required for adapter'
        type: string
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run core tests
        run: bash tools/test_core.sh
      - name: Check upgrade with Android-compatible SQLite 3.22
        run: python3 tools/test_legacy_sqlite.py
      - name: Prepare adapter signer (manufacturer public key)
        if: inputs.build_adapter
        run: python3 tools/prepare_signer.py
      - name: Build relay and lint
        run: |
          if [ -f vendor/community/sha256.txt ]; then
            gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest -PlpaSignerSha256="$(cat vendor/community/sha256.txt)"
          else
            gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SMS-Most.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/SMS-Most-unsigned.apk
      - name: Export APK signing utility
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tool
          path: signing-tool/apksigner.jar
      - name: Fetch reviewed bridge
        if: inputs.build_adapter
        env:
          BRIDGE_REF: ${{ inputs.bridge_ref }}
        run: |
          [[ "$BRIDGE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'A reviewed 40-character commit SHA is required'; exit 1; }
          git clone https://github.com/Laiteux/openeuicc-bridge.git vendor/bridge
          git -C vendor/bridge checkout --detach "$BRIDGE_REF"
      - name: Build protected adapter companion
        if: inputs.build_adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          python3 tools/build_companion.py --bridge vendor/bridge --relay-apk dist/SMS-Most.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-Most-APK
          path: dist/*.apk
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation
          path: app/build/reports/
          if-no-files-found: ignore
