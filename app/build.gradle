plugins { id 'com.android.application' }
android {
    namespace 'ru.smsbridge.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'ru.smsbridge.app'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
    defaultConfig { buildConfigField 'String', 'LPA_SIGNER_SHA256', '"' + (project.findProperty('lpaSignerSha256') ?: '') + '"' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
