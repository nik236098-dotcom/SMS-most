plugins { id 'com.android.application' }
android {
    namespace 'ru.smsbridge.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'ru.smsbridge.app'; minSdk 28; targetSdk 35; versionCode 13; versionName '0.13.0' }
    defaultConfig { buildConfigField 'String', 'LPA_SIGNER_SHA256', '"' + (project.findProperty('lpaSignerSha256') ?: '') + '"' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.json:json:20240303'
}
